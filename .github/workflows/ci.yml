name: CI Test Suite & Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Run PHP Quality Assurance & Verification Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3 runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, sqlite3, pdo_sqlite, mbstring, fileinfo, curl, openssl
          coverage: none

      - name: Verify PHP Environment & Extensions
        run: |
          php -v
          php -m

      - name: Execute Automated 77-Assertion Test Suite
        run: |
          php tests/run-tests.php

      - name: Start Built-in PHP Development Server in Background
        run: |
          php -S 127.0.0.1:8000 -t public public/index.php > /dev/null 2>&1 &
          sleep 2

      - name: Execute End-to-End HTTP 43-Endpoint Verification Suite
        run: |
          php tests/http-verify.php
